<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="My Pigeon Chrome Extension">
    <title>My Pigeon</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="download-page">
      <a
        class="pigeon-download"
        id="download-button"
        href="https://github.com/meoyaho/my-pigeon#chrome%EC%97%90%EC%84%9C-%EA%B0%80%EB%B3%8D%EA%B2%8C-%EC%8D%A8%EB%B3%B4%EA%B8%B0"
        aria-label="My Pigeon Chrome Extension 열기"
      >
        <span class="text-frame" aria-hidden="true">
          <span class="pigeon-text default-text">규.</span>
          <span class="pigeon-text hover-text">나 안아.</span>
        </span>
        <span class="pigeon-frame" aria-hidden="true">
          <img class="pigeon-image pigeon-default" src="./assets/pigeon-1.png" alt="">
          <img class="pigeon-image pigeon-hover" src="./assets/pigeon-2.png" alt="">
        </span>
      </a>
      <p class="download-status" id="download-status" aria-live="polite">
        Chrome 확장 프로그램 설치 안내로 이동합니다.
      </p>
    </main>
  </body>
</html>
